name: Publish notebook to portfolio

on:
  push:
    branches:
      - main
    paths:
      - us_snd_model_results.ipynb
      - .github/workflows/publish-notebook.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-notebook-${{ github.repository }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install notebook exporter
        run: python -m pip install --disable-pip-version-check "nbconvert==7.16.6"

      - name: Confirm the notebook contains saved results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          notebook_path = Path("us_snd_model_results.ipynb")
          notebook = json.loads(notebook_path.read_text(encoding="utf-8"))
          code_cells = [cell for cell in notebook.get("cells", []) if cell.get("cell_type") == "code"]
          saved_outputs = sum(len(cell.get("outputs", [])) for cell in code_cells)

          if saved_outputs == 0:
              raise SystemExit(
                  "The notebook has no saved outputs. Run it locally and commit the updated notebook before publishing."
              )

          print(f"Found {saved_outputs} saved output blocks in {len(code_cells)} code cells.")
          PY

      - name: Render the committed notebook
        run: |
          mkdir -p publish
          jupyter nbconvert \
            --to html \
            --template lab \
            --HTMLExporter.exclude_input_prompt=True \
            --HTMLExporter.exclude_output_prompt=True \
            --output us_snd_model_results.html \
            --output-dir publish \
            us_snd_model_results.ipynb
          cp us_snd_model_results.ipynb publish/

      - name: Configure secure Bluehost connection
        env:
          BLUEHOST_SSH_KEY: ${{ secrets.BLUEHOST_SSH_KEY }}
          BLUEHOST_KNOWN_HOSTS: ${{ secrets.BLUEHOST_KNOWN_HOSTS }}
        run: |
          printf '%s\n' "$BLUEHOST_SSH_KEY" > "$RUNNER_TEMP/bluehost_deploy_key"
          printf '%s\n' "$BLUEHOST_KNOWN_HOSTS" > "$RUNNER_TEMP/bluehost_known_hosts"
          chmod 600 "$RUNNER_TEMP/bluehost_deploy_key"
          chmod 644 "$RUNNER_TEMP/bluehost_known_hosts"

      - name: Upload notebook to portfolio
        env:
          DEPLOY_HOST: 162.241.216.86
          DEPLOY_USER: calvind0
          DEPLOY_DIR: /home4/calvind0/public_html/project-notebooks/crude
        run: |
          ssh_options=(
            -i "$RUNNER_TEMP/bluehost_deploy_key"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/bluehost_known_hosts"
          )

          html_temp="$DEPLOY_DIR/.us_snd_model_results.html.$GITHUB_RUN_ID"
          notebook_temp="$DEPLOY_DIR/.us_snd_model_results.ipynb.$GITHUB_RUN_ID"

          scp "${ssh_options[@]}" publish/us_snd_model_results.html \
            "$DEPLOY_USER@$DEPLOY_HOST:$html_temp"
          scp "${ssh_options[@]}" publish/us_snd_model_results.ipynb \
            "$DEPLOY_USER@$DEPLOY_HOST:$notebook_temp"

          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mv '$html_temp' '$DEPLOY_DIR/us_snd_model_results.html' && \
             mv '$notebook_temp' '$DEPLOY_DIR/us_snd_model_results.ipynb' && \
             chmod 644 '$DEPLOY_DIR/us_snd_model_results.html' '$DEPLOY_DIR/us_snd_model_results.ipynb'"
