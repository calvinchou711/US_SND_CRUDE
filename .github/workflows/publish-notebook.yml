name: Publish notebooks to portfolio

on:
  push:
    branches:
      - main
    paths:
      - us_snd_model_results.ipynb
      - predictors_crude.ipynb
      - .github/workflows/publish-notebook.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-notebooks-${{ github.repository }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install notebook exporter
        run: python -m pip install --disable-pip-version-check "nbconvert==7.16.6"

      - name: Confirm the notebooks contain saved results
        run: |
          for notebook in us_snd_model_results.ipynb predictors_crude.ipynb; do
            python - "$notebook" <<'PY'
          import json
          import sys
          from pathlib import Path

          notebook_path = Path(sys.argv[1])
          notebook = json.loads(notebook_path.read_text(encoding="utf-8"))
          code_cells = [cell for cell in notebook.get("cells", []) if cell.get("cell_type") == "code"]
          saved_outputs = sum(len(cell.get("outputs", [])) for cell in code_cells)

          if saved_outputs == 0:
              raise SystemExit(
                  f"{notebook_path} has no saved outputs. Run it locally and commit it before publishing."
              )

          print(f"{notebook_path}: {saved_outputs} saved output blocks in {len(code_cells)} code cells.")
          PY
          done

      - name: Render the committed notebooks
        run: |
          mkdir -p publish
          for notebook in us_snd_model_results.ipynb predictors_crude.ipynb; do
            output_name="${notebook%.ipynb}.html"
            jupyter nbconvert \
              --to html \
              --template lab \
              --HTMLExporter.exclude_input_prompt=True \
              --HTMLExporter.exclude_output_prompt=True \
              --output "$output_name" \
              --output-dir publish \
              "$notebook"
            cp "$notebook" publish/
          done

      - name: Configure secure Bluehost connection
        env:
          BLUEHOST_SSH_KEY: ${{ secrets.BLUEHOST_SSH_KEY }}
          BLUEHOST_KNOWN_HOSTS: ${{ secrets.BLUEHOST_KNOWN_HOSTS }}
        run: |
          printf '%s\n' "$BLUEHOST_SSH_KEY" > "$RUNNER_TEMP/bluehost_deploy_key"
          printf '%s\n' "$BLUEHOST_KNOWN_HOSTS" > "$RUNNER_TEMP/bluehost_known_hosts"
          chmod 600 "$RUNNER_TEMP/bluehost_deploy_key"
          chmod 644 "$RUNNER_TEMP/bluehost_known_hosts"

      - name: Upload notebooks to portfolio
        env:
          DEPLOY_HOST: 162.241.216.86
          DEPLOY_USER: calvind0
          DEPLOY_DIR: /home4/calvind0/public_html/project-notebooks/crude
        run: |
          ssh_options=(
            -i "$RUNNER_TEMP/bluehost_deploy_key"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
            -o "UserKnownHostsFile=$RUNNER_TEMP/bluehost_known_hosts"
          )

          control_path="$RUNNER_TEMP/bluehost_control"
          connected=false
          for attempt in 1 2 3 4 5; do
            if ssh "${ssh_options[@]}" -M -S "$control_path" -o ControlPersist=60 -fnNT \
              "$DEPLOY_USER@$DEPLOY_HOST"; then
              connected=true
              break
            fi
            sleep $((attempt * 10))
          done

          if [ "$connected" != true ]; then
            echo "Unable to establish the Bluehost deployment connection after five attempts."
            exit 1
          fi

          shared_connection=(-o "ControlPath=$control_path")
          files=(
            us_snd_model_results.html
            us_snd_model_results.ipynb
            predictors_crude.html
            predictors_crude.ipynb
          )

          for file_name in "${files[@]}"; do
            scp "${shared_connection[@]}" "publish/$file_name" \
              "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/.$file_name.$GITHUB_RUN_ID"
          done

          ssh "${shared_connection[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mv '$DEPLOY_DIR/.us_snd_model_results.html.$GITHUB_RUN_ID' '$DEPLOY_DIR/us_snd_model_results.html' && \
             mv '$DEPLOY_DIR/.us_snd_model_results.ipynb.$GITHUB_RUN_ID' '$DEPLOY_DIR/us_snd_model_results.ipynb' && \
             mv '$DEPLOY_DIR/.predictors_crude.html.$GITHUB_RUN_ID' '$DEPLOY_DIR/predictors_crude.html' && \
             mv '$DEPLOY_DIR/.predictors_crude.ipynb.$GITHUB_RUN_ID' '$DEPLOY_DIR/predictors_crude.ipynb' && \
             chmod 644 '$DEPLOY_DIR/us_snd_model_results.html' '$DEPLOY_DIR/us_snd_model_results.ipynb' \
               '$DEPLOY_DIR/predictors_crude.html' '$DEPLOY_DIR/predictors_crude.ipynb'"

          ssh -S "$control_path" -O exit "$DEPLOY_USER@$DEPLOY_HOST" || true
